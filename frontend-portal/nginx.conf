# 该文件位于 /etc/nginx/templates/ 下，nginx:alpine 镜像启动时
# 会用 20-envsubst-on-templates.sh 将 ${...} 替换为容器环境变量后
# 输出到 /etc/nginx/conf.d/default.conf。
# 只声明需要替换的变量，避免把 nginx 自身的 $uri、$http_x 等变量误替换掉。
server {
    listen ${CONTAINER_PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 健康检查：容器 healthcheck 与发布前冒烟都请求这里
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # 构建版本信息：发布后可直接 curl /version.json 核对代码提交
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 后端接口代理：与 vite dev/preview 的 proxy 行为对齐（去掉 /api 前缀后转发）
    # 后端不可达时返回明确的 502 + JSON，方便定位是"接口挂了"而不是页面 404
    location /api/ {
        proxy_pass ${BACKEND_URL}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 502 '{"code":502,"message":"backend service unavailable"}';
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
